        :root {

            --accent: #a5b4fc;

            --dark: #1e1b4b;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
        }
        .header {
            background-color: var(--primary);
            color: #fff;
            padding: 1em;
            text-align: center;
        }
        .header a {
            color: #fff;
            text-decoration: none;
        }
        .card {
            background-color: #fff;
            padding: 1em;
            margin: 1em;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            margin-top: 0;
        }
        .card p {
            margin-bottom: 1em;
        }
        .card button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 1em 2em;
            font-size: 1em;
            cursor: pointer;
        }
        .card button:hover {
            background-color: var(--secondary);
        }
        .loading {
            display: none;
            margin: 1em;
            padding: 1em;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .loading img {
            width: 50px;
            height: 50px;
            margin: 1em auto;
        }
    </style>
</head>
